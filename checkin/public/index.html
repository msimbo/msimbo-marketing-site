<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1A1A1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Check-In">
  <meta name="format-detection" content="telephone=no">
  <title>ULEM Check-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="mark">ULEM</span> Check-In</div>
    <div class="clock" id="clock" aria-live="off"></div>
  </header>

  <main id="app" aria-live="polite">
    <!-- 1. programs with a class today -->
    <section id="screen-programs" class="screen">
      <h1 class="title">Welcome. <em>Which program are you here for?</em></h1>
      <div id="programs" class="cards"></div>
    </section>

    <!-- 2. today's class list -->
    <section id="screen-roster" class="screen" hidden>
      <div class="roster-head">
        <button class="back" data-go="programs">&larr; Programs</button>
        <h1 class="title" id="roster-title"></h1>
        <p class="sub" id="roster-sub"></p>
      </div>
      <div id="search" class="search" hidden>
        <input id="q" type="search" placeholder="Type your first or last name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" aria-label="Search your name">
      </div>
      <h2 class="label" id="people-label" hidden></h2>
      <div id="people" class="people"></div>
      <h2 class="label" id="here-label" hidden>Here now &middot; tap to check out</h2>
      <div id="here" class="people"></div>
    </section>

    <!-- 2b. reason for the visit (programs with check-in reasons) -->
    <section id="screen-reason" class="screen" hidden>
      <button class="back" data-go="roster">&larr; Not you?</button>
      <h1 class="title" id="reason-title"></h1>
      <p class="sub">What brings you in today?</p>
      <div id="reasons" class="reasons"></div>
    </section>

    <!-- 3. PIN -->
    <section id="screen-pin" class="screen" hidden>
      <div class="pin-info">
        <button class="back" data-go="roster">&larr; Not you?</button>
        <h1 class="title" id="pin-title"></h1>
        <p class="sub">Enter the last 4 digits of the phone number we have on file.</p>
        <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
        <p class="error" id="pin-error" role="alert"></p>
      </div>
      <div class="pin-pad">
        <div class="keypad" id="keypad"></div>
        <button class="primary" id="submit" disabled></button>
      </div>
    </section>

    <!-- 4. done -->
    <section id="screen-done" class="screen center" hidden>
      <div class="tick" aria-hidden="true">&#10003;</div>
      <h1 class="title" id="done-title"></h1>
      <p class="sub" id="done-sub"></p>
      <button class="secondary" data-go="roster">Done</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
