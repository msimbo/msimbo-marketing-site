[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shareable direct link to the info session form. Rewrite (not redirect) so
# UTM params survive; app.js scrolls to #info-session on these paths.
# While the info session section is hidden, app.js scrolls to #apply instead.
[[redirects]]
  from = "/info-session"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/info-sessions"
  to = "/index.html"
  status = 200
